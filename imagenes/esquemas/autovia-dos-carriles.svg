<title id="t">Autovía de dos carriles</title>
<desc id="d">Calzada de autovía con dos carriles en el mismo sentido, separados por una línea discontinua, con flechas de frente. A la izquierda, la mediana con barrera; a la derecha, el arcén.</desc>
