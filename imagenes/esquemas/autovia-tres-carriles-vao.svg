<title id="t">Autovía con un carril VAO</title>
<desc id="d">Calzada de autovía con tres carriles en el mismo sentido. El de la izquierda está reservado a vehículos con alta ocupación: lleva un rombo y la inscripción VAO, y lo separa una línea continua. Junto a la vía, la señal de carril VAO.</desc>
