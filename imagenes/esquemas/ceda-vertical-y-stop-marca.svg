<title id="t">Ceda el paso vertical y STOP pintado</title>
<desc id="d">Vista desde el conductor al llegar a una intersección: a la derecha, una señal vertical de ceda el paso; en la calzada, una línea de detención continua con la palabra STOP pintada.</desc>
