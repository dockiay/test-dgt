<title id="t">Cruce sin señalizar con tres vehículos</title>
<desc id="d">Cruce de cuatro brazos sin señales, marcas ni semáforos. El vehículo A llega por el sur, el B por el este y el C por el norte; los tres quieren seguir recto. El brazo oeste está vacío.</desc>
