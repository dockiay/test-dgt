<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d">
<title id="t">Cruce con tranvía</title>
<desc id="d">Cruce sin señales ni semáforos. El vehículo A llega por el sur y va a seguir recto; por su izquierda se acerca un tranvía sobre sus raíles.</desc>
<defs><marker id="punta-A" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d43d3d"/></marker><marker id="punta-B" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a66cc"/></marker><marker id="punta-C" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3a21a"/></marker><marker id="punta-D" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9a4f"/></marker></defs>
<rect x="0" y="0" width="400" height="400" fill="#cfe0b8" />
<rect x="160.0" y="0" width="80" height="400" fill="#5f646b" />
<rect x="0" y="160.0" width="400" height="80" fill="#5f646b" />
<line x1="200" y1="0" x2="200" y2="160" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 14"/>
<line x1="200" y1="240" x2="200" y2="400" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 14"/>
