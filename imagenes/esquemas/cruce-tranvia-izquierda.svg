<g transform="translate(220.0 320.0) rotate(0.0)"><rect x="-11.0" y="-20.0" width="22" height="40" rx="6" fill="#d43d3d" stroke="#1b1b1b" stroke-width="1.5"/><rect x="-8.0" y="-14.0" width="16" height="8" rx="2" fill="#20262e"/><rect x="-8.0" y="11.0" width="16" height="5" rx="2" fill="#20262e"/><text x="0" y="5" transform="rotate(0.0)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#fff">A</text></g>
<path d="M220,292 L220,110" fill="none" stroke="#d43d3d" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9" marker-end="url(#punta-A)"/>
