<title id="t">Línea continua adosada a discontinua</title>
<desc id="d">Calzada de doble sentido cuyo eje está formado por una línea continua adosada a una discontinua. El vehículo A circula por el carril contiguo a la línea discontinua; el B, en sentido contrario, junto a la continua.</desc>
