<rect x="180" y="170.0" width="80" height="80" rx="10" fill="#0e1013" stroke="#6b717a" stroke-width="4"/>
<text x="220.0" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#e8eaed" >Freno</text>
<rect x="318.0" y="40" width="10" height="110.0" fill="#555b64"/>
