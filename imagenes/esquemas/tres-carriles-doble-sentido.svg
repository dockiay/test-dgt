<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d">
<title id="t">Calzada de tres carriles y doble sentido</title>
<desc id="d">Calzada de doble sentido con tres carriles separados por líneas discontinuas. Los vehículos A y B circulan hacia la derecha por el carril de abajo; el C, en sentido contrario, por el carril de arriba. El carril central está libre.</desc>
<defs><marker id="punta-A" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d43d3d"/></marker><marker id="punta-B" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a66cc"/></marker><marker id="punta-C" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3a21a"/></marker><marker id="punta-D" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9a4f"/></marker></defs>
<rect x="0" y="0" width="400" height="400" fill="#cfe0b8" />
<rect x="0" y="140" width="400" height="120" fill="#5f646b" />
<line x1="0" y1="142" x2="400" y2="142" stroke="#ffffff" stroke-width="3"/>
<line x1="0" y1="258" x2="400" y2="258" stroke="#ffffff" stroke-width="3"/>
<line x1="0" y1="180" x2="400" y2="180" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 14"/>
<line x1="0" y1="220" x2="400" y2="220" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 14"/>
<g transform="translate(110.0 240.0) rotate(90.0)"><rect x="-11.0" y="-20.0" width="22" height="40" rx="6" fill="#d43d3d" stroke="#1b1b1b" stroke-width="1.5"/><rect x="-8.0" y="-14.0" width="16" height="8" rx="2" fill="#20262e"/><rect x="-8.0" y="11.0" width="16" height="5" rx="2" fill="#20262e"/><text x="0" y="5" transform="rotate(-90.0)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#fff">A</text></g>
<g transform="translate(220.0 240.0) rotate(90.0)"><rect x="-11.0" y="-20.0" width="22" height="40" rx="6" fill="#2a66cc" stroke="#1b1b1b" stroke-width="1.5"/><rect x="-8.0" y="-14.0" width="16" height="8" rx="2" fill="#20262e"/><rect x="-8.0" y="11.0" width="16" height="5" rx="2" fill="#20262e"/><text x="0" y="5" transform="rotate(-90.0)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#fff">B</text></g>
<g transform="translate(330.0 160.0) rotate(270.0)"><rect x="-11.0" y="-20.0" width="22" height="40" rx="6" fill="#e3a21a" stroke="#1b1b1b" stroke-width="1.5"/><rect x="-8.0" y="-14.0" width="16" height="8" rx="2" fill="#20262e"/><rect x="-8.0" y="11.0" width="16" height="5" rx="2" fill="#20262e"/><text x="0" y="5" transform="rotate(-270.0)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#fff">C</text></g>
</svg>
