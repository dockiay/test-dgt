<title id="t">Túnel con dos carriles en su sentido</title>
<desc id="d">Túnel con circulación en ambos sentidos: dos carriles hacia la derecha, separados por una línea discontinua, y uno hacia la izquierda, separado por una línea continua. El vehículo A circula detrás del B por el carril derecho; el C, en sentido contrario.</desc>
