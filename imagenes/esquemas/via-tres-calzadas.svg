<title id="t">Vía con tres calzadas</title>
<desc id="d">Vía dividida en tres calzadas separadas por medianas. La calzada de la izquierda lleva flechas hacia abajo y la de la derecha, hacia arriba; la central no lleva flechas.</desc>
