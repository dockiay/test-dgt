<title id="t">Calzada ancha sin marcas</title>
<desc id="d">Calzada de doble sentido sin ninguna marca vial longitudinal, con anchura para dos filas de turismos en cada sentido. El vehículo A sube junto al borde derecho; el B baja junto al otro borde.</desc>
