<title id="t">Giro a la izquierda con un vehículo de frente</title>
<desc id="d">Cruce visto desde arriba. El vehículo A está en el cruce y quiere girar a la izquierda; el vehículo B se acerca de frente, a poca distancia, y va a seguir recto.</desc>
