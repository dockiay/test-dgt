<title id="t">Plataforma única de calzada y acera</title>
<desc id="d">Calle en la que la calzada y la acera están al mismo nivel, sin bordillo, separadas solo por un cambio de pavimento y bolardos. Hay peatones andando, uno en la zona central, y el vehículo A circula por ella.</desc>
