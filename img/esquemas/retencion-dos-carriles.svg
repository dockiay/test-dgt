<title id="t">Retención en una vía de dos carriles</title>
<desc id="d">Calzada con dos carriles en el mismo sentido y la circulación detenida: los turismos esperan en fila en los dos carriles. A la izquierda, la mediana; a la derecha, el arcén.</desc>
